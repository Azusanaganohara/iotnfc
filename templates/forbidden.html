<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #0f111a; 
            background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%); 
            font-family: 'Inter', -apple-system, sans-serif; 
            color: #ffffff; 
        }
        .glass-panel { 
            background: rgba(25, 28, 41, 0.6); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 16px; 
            padding: 40px; 
            text-align: center; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); 
            max-width: 400px; 
            width: 90%; 
        }
        h1 { 
            font-size: 80px; 
            margin: 0; 
            background: linear-gradient(135deg, #ef4444 0%, #f97316 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text; 
        }
        h2 { 
            margin: 10px 0 20px 0; 
            font-size: 24px; 
            font-weight: 600; 
        }
        p { 
            color: #94a3b8; 
            margin-bottom: 0; 
            line-height: 1.6; 
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1>403</h1>
        <h2>Access Forbidden</h2>
        <p>You don't have permission to access this resource. If you believe this is an error, please contact the administrator.</p>
    </div>
</body>
</html>
