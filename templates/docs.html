<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT KTP API Documentation</title>
    <!-- Github Markdown CSS for beautiful docs styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            background-color: #ffffff;
        }
        @media (max-width: 767px) {
            body { padding: 15px; }
        }
        .header {
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eaecef;
        }
    </style>
</head>
<body class="markdown-body">
    <!-- The raw markdown content from Go template -->
    <textarea id="raw-markdown" style="display:none;">{{ .content }}</textarea>
    
    <div id="rendered-html">Loading documentation...</div>

    <!-- Marked.js to convert Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var rawMd = document.getElementById("raw-markdown").value;
            
            // Setup marked to use highlight.js
            marked.setOptions({
                highlight: function(code, lang) {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true,
                gfm: true
            });

            // Render!
            document.getElementById("rendered-html").innerHTML = marked.parse(rawMd);
        });
    </script>
</body>
</html>
